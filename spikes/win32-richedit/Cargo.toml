[package]
name = "spike-richedit"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Deliberately outside the product workspace: a spike must never enter the
# installer manifest or the product's dependency graph.
[workspace]

[dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
