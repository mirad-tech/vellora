name: 功能建议
description: 建议符合 Vellora 本地优先定位的改进
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Vellora 专注于 Windows 本地 Markdown 阅读与轻量编辑。请先说明真实使用场景。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 当前在哪个工作流中遇到什么问题？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述希望出现的行为，而不是只给组件或界面名称。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式
      description: 可选。说明现有功能为什么不足。

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 建议保持文档本地处理，不依赖云端上传。
          required: true
        - label: 建议不会扩大任意文件系统、Shell 或任意 URL 权限。
          required: true
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 可选。可附无隐私信息的示例或界面截图。
