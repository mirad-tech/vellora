name: 功能建议 / Feature request
description: 建议符合 Vellora 本地优先定位的改进 / Suggest a local-first improvement
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Vellora 是本地优先的 Markdown 阅读与轻量编辑器：Windows 提供正式 Release；macOS 仅提供源码、构建与 CI 支持。请说明真实使用场景。
        Vellora is a local-first Markdown reader and lightweight editor: Windows has official Releases; macOS has source, build, and CI support only. Describe the real use case.

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: 当前在哪个工作流中遇到什么问题？ / What problem occurs in which workflow?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed behavior
      description: 描述希望出现的行为，而不只是组件或界面名称 / Describe the desired behavior, not only a component or screen name.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式 / Alternatives tried
      description: 可选。说明现有功能为什么不足 / Optional. Explain why current options are insufficient.

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认 / Scope confirmation
      options:
        - label: 建议保持文档本地处理，不依赖云端上传 / The proposal keeps documents local and does not require cloud upload.
          required: true
        - label: 建议不会扩大任意文件系统、Shell 或任意 URL 权限 / The proposal does not broaden arbitrary filesystem, Shell, or URL permissions.
          required: true
        - label: 我已搜索现有 Issue，未发现相同建议 / I searched existing Issues and found no duplicate.
          required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充信息 / Additional context
      description: 可选。可附不含隐私信息的示例或截图 / Optional. Attach only redacted examples or screenshots.
