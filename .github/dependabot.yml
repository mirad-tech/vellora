version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 8
    groups:
      tauri-js:
        patterns:
          - '@tauri-apps/*'
        update-types:
          - minor
          - patch
      desktop-e2e:
        patterns:
          - '@wdio/*'
          - 'puppeteer-core'
        update-types:
          - minor
          - patch
      frontend-runtime:
        dependency-type: production
        patterns:
          - '*'
        exclude-patterns:
          - '@tauri-apps/*'
        update-types:
          - minor
          - patch
      frontend-build:
        patterns:
          - '@vitejs/*'
          - 'vite'
          - 'typescript'
        update-types:
          - minor
          - patch
      frontend-test:
        patterns:
          - '@testing-library/*'
          - 'jsdom'
          - 'vitest'
        update-types:
          - minor
          - patch
      type-definitions:
        patterns:
          - '@types/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 6
    groups:
      tauri-rust:
        patterns:
          - 'tauri'
          - 'tauri-*'
        update-types:
          - minor
          - patch
      serde:
        patterns:
          - 'serde'
          - 'serde_json'
        update-types:
          - minor
          - patch
      rust-other:
        patterns:
          - '*'
        exclude-patterns:
          - 'tauri'
          - 'tauri-*'
          - 'serde'
          - 'serde_json'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      ci-actions:
        patterns:
          - 'github/*'
          - 'actions/*'
          - 'dtolnay/rust-toolchain'
        update-types:
          - minor
          - patch
