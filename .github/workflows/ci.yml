name: CI

on:
  push:
    branches:
      - main
      - linux-port
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Rust quality gates
        shell: pwsh
        run: ./tools/check.ps1

  qt:
    name: Qt 6.8.3 + Rust Full Regressions
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Qt 6.8.3 MSVC 2022 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats'
          cache: 'true'

      - name: Run full build and regression suites
        shell: pwsh
        run: ./tools/check.ps1 -Full

  linux:
    name: Linux ${{ matrix.arch }} (Qt 6.8.3 + Rust, AppImage)
    # The oldest supported Ubuntu runner sets the AppImage's minimum glibc.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
          # Qt's own 6.8.3 linux_gcc_arm64 binaries are built on Ubuntu 24.04
          # (libQt6Gui needs GLIBC_2.38), so the aarch64 build can't run on 22.04.
          - os: ubuntu-24.04-arm
            arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl1-mesa-dev libegl1 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 fonts-noto-core fonts-noto-cjk fonts-dejavu-core file

      - name: Install Qt 6.8.3 (${{ matrix.qt_arch }})
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtimageformats'
          cache: 'true'

      - name: Rust formatting and Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release packaging rules
        run: |
          python installer/tests/test_release_policy.py
          python installer/tests/test_association_policy.py

      - name: Build and run Rust + Qt regression suites
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QT_QPA_PLATFORM: offscreen
        run: ./qt-app/build.sh --test

      - name: Package AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          VELLORA_ARCH: ${{ matrix.arch }}
        run: SKIP_BUILD=0 ./installer/linux/package-appimage.sh "$GITHUB_WORKSPACE/dist"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: vellora-linux-${{ matrix.arch }}-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  # One-off helper: attaches the Linux AppImages built by the `linux` job to an
  # existing GitHub release. Inert unless a push to linux-port carries the
  # [upload-linux-release] marker in its head commit message, and it never
  # replaces assets that are already on the release (no --clobber).
  # v0.1.7 AppImages were attached by run 45857352278 (commit e097d6a); the job
  # stays here, inert, for reuse with a future release.
  release-linux:
    name: Attach Linux AppImages to release v0.1.7
    needs: linux
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/linux-port' &&
      contains(github.event.head_commit.message, '[upload-linux-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.7
    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vellora-linux-*-appimage
          path: appimages
          merge-multiple: true

      - name: Upload AppImages to release
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(appimages/*.AppImage)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "Expected 2 AppImages, found ${#files[@]}:"; ls -la appimages; exit 1
          fi
          ls -la "${files[@]}"
          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          to_upload=()
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            if grep -Fxq "$name" <<<"$existing"; then
              echo "Asset $name already on $RELEASE_TAG; skipping."
            else
              to_upload+=("$f")
            fi
          done
          if [ "${#to_upload[@]}" -eq 0 ]; then
            echo "Nothing to upload."; exit 0
          fi
          gh release upload "$RELEASE_TAG" "${to_upload[@]}" --repo "$GITHUB_REPOSITORY"
