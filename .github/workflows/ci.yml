name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Rust quality gates
        shell: pwsh
        run: ./tools/check.ps1

  qt:
    name: Qt 6.8.3 + Rust Full Regressions
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Qt 6.8.3 MSVC 2022 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats'
          cache: 'true'

      - name: Run full build and regression suites
        shell: pwsh
        run: ./tools/check.ps1 -Full

  linux:
    name: Linux ${{ matrix.arch }} (Qt 6.8.3 + Rust, AppImage)
    # The oldest supported Ubuntu runner sets the AppImage's minimum glibc.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: ubuntu-22.04-arm
            arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl1-mesa-dev libegl1 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 fonts-noto-core fonts-noto-cjk fonts-dejavu-core file

      - name: Install Qt 6.8.3 (${{ matrix.qt_arch }})
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtimageformats'
          cache: 'true'

      - name: Rust formatting and Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release packaging rules
        run: |
          python installer/tests/test_release_policy.py
          python installer/tests/test_association_policy.py

      - name: Build and run Rust + Qt regression suites
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QT_QPA_PLATFORM: offscreen
        run: ./qt-app/build.sh --test

      - name: Package AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          VELLORA_ARCH: ${{ matrix.arch }}
        run: SKIP_BUILD=0 ./installer/linux/package-appimage.sh "$GITHUB_WORKSPACE/dist"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: vellora-linux-${{ matrix.arch }}-appimage
          path: dist/*.AppImage
          if-no-files-found: error
