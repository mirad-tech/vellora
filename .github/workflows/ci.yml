name: CI

on:
  # Markdown-only pushes to main don't start CI. Pull requests always start it
  # so the required checks report, but a Markdown-only PR skips the real work
  # (the `changes` job below) and the skipped checks count as passed.
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anything besides Markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          if echo "$files" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Markdown-only change: build and test jobs are skipped."
          fi

  rust:
    name: Rust (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Rust quality gates
        shell: pwsh
        run: ./tools/check.ps1

  qt:
    name: Qt 6.8.3 + Rust Full Regressions
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Qt 6.8.3 MSVC 2022 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats'
          cache: 'true'

      - name: Run full build and regression suites
        shell: pwsh
        run: ./tools/check.ps1 -Full

  windows-installer:
    name: Windows installer (test build)
    # Only on a manual run (Actions > CI > Run workflow, pick the branch): builds
    # Setup and the portable zip from that commit so it can be tried on a real
    # machine. Not a release.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: installer

      - name: Install Qt 6.8.3 MSVC 2022 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats'
          cache: 'true'

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path -LiteralPath $nsis)) { choco install nsis -y --no-progress }
          if (!(Test-Path -LiteralPath $nsis)) { throw 'makensis.exe not found' }
          "MAKENSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Setup and portable zip
        shell: pwsh
        run: ./installer/package-qt.ps1 -QtRoot $env:QT_ROOT_DIR -MakeNsis $env:MAKENSIS -OutputDir "$env:GITHUB_WORKSPACE\dist" -RunTests $false

      - name: Upload Setup and portable zip
        uses: actions/upload-artifact@v4
        with:
          name: vellora-windows-installer
          path: |
            dist/Vellora-Setup-*.exe
            dist/Vellora-*-portable-x64.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (Qt 6.8.3 + Rust, AppImage)
    # The oldest supported Ubuntu runner sets the AppImage's minimum glibc.
    # A skipped matrix job reports under an unexpanded name, so the required
    # checks would never pass; skip the steps instead.
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
          # Qt's own 6.8.3 linux_gcc_arm64 binaries are built on Ubuntu 24.04
          # (libQt6Gui needs GLIBC_2.38), so the aarch64 build can't run on 22.04.
          - os: ubuntu-24.04-arm
            arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Install Python 3.12
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - name: Install system packages
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl1-mesa-dev libegl1 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 fonts-noto-core fonts-noto-cjk fonts-dejavu-core file

      - name: Install Qt 6.8.3 (${{ matrix.qt_arch }})
        if: needs.changes.outputs.code == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtimageformats'
          cache: 'true'

      - name: Rust formatting and Clippy
        if: needs.changes.outputs.code == 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release packaging rules
        if: needs.changes.outputs.code == 'true'
        run: |
          python installer/tests/test_release_policy.py
          python installer/tests/test_association_policy.py
          python tools/check_translations.py

      - name: Build and run Rust + Qt regression suites
        if: needs.changes.outputs.code == 'true'
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QT_QPA_PLATFORM: offscreen
        run: ./qt-app/build.sh --test

      - name: Package AppImage
        if: needs.changes.outputs.code == 'true'
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          VELLORA_ARCH: ${{ matrix.arch }}
        run: SKIP_BUILD=0 ./installer/linux/package-appimage.sh "$GITHUB_WORKSPACE/dist"

      - name: Upload AppImage
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vellora-linux-${{ matrix.arch }}-appimage
          path: dist/*.AppImage
          if-no-files-found: error
