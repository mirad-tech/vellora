name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action snapshot 2026-08-05
        with:
          toolchain: 1.97.0
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rust
      - run: npm run build:web

  macos:
    name: macOS (${{ matrix.runner }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action snapshot 2026-08-05
        with:
          toolchain: 1.97.0
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rust
      - run: npm run build:web
      - name: Install Universal Rust targets
        if: matrix.runner == 'macos-15'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build and verify ad-hoc Universal DMG
        if: matrix.runner == 'macos-15'
        run: npm run dist:mac
      - name: Upload Universal DMG test artifact
        if: matrix.runner == 'macos-15'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vellora-macos-universal-test
          path: artifacts/releases/macos
          if-no-files-found: error

  macos-universal-intel:
    name: Universal DMG verification (Intel)
    needs: macos
    timeout-minutes: 20
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vellora-macos-universal-test
          path: artifacts/releases/macos
      - run: npm run release:check:mac

  ci-success:
    name: ci-success
    if: ${{ !cancelled() }}
    needs: [verify, macos, macos-universal-intel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI jobs
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          MACOS_UNIVERSAL_INTEL_RESULT: ${{ needs.macos-universal-intel.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'verify=%s\nmacos=%s\nmacos-universal-intel=%s\n' \
            "$VERIFY_RESULT" "$MACOS_RESULT" "$MACOS_UNIVERSAL_INTEL_RESULT"
          for result in "$VERIFY_RESULT" "$MACOS_RESULT" "$MACOS_UNIVERSAL_INTEL_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Required CI job finished with result: $result" >&2
              exit 1
            fi
          done
