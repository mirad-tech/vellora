name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - run: npm run test:rust
      - run: npm run test:e2e:ci
      - run: npm run dist
      - run: npm run release:check
      - name: Upload verified Windows release inputs
        uses: actions/upload-artifact@v4
        with:
          name: vellora-windows-installer
          path: |
            artifacts/releases/current/Vellora_*_x64-setup.exe
            artifacts/releases/manifest.json
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        with:
          name: vellora-windows-installer
          path: release-assets
      - name: Verify and publish Windows-only GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION." >&2
            exit 1
          fi

          EXPECTED_NAME="Vellora_${VERSION}_x64-setup.exe"
          mapfile -t INPUTS < <(find release-assets -type f -print | sort)
          mapfile -t INSTALLERS < <(find release-assets -type f -name "$EXPECTED_NAME" -print)
          mapfile -t MANIFESTS < <(find release-assets -type f -name 'manifest.json' -print)
          if [ "${#INPUTS[@]}" -ne 2 ] || [ "${#INSTALLERS[@]}" -ne 1 ] || [ "${#MANIFESTS[@]}" -ne 1 ]; then
            echo "Expected exactly $EXPECTED_NAME and manifest.json; found ${#INPUTS[@]} file(s)." >&2
            exit 1
          fi

          INSTALLER=${INSTALLERS[0]}
          MANIFEST=${MANIFESTS[0]}
          mapfile -t MANIFEST_FIELDS < <(
            node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));for(const value of [m.projectVersion,m.current?.path,m.current?.bytes,m.current?.sha256])console.log(value??'');" "$MANIFEST"
          )
          if [ "${#MANIFEST_FIELDS[@]}" -ne 4 ]; then
            echo "Release manifest is incomplete." >&2
            exit 1
          fi

          MANIFEST_VERSION=${MANIFEST_FIELDS[0]}
          MANIFEST_PATH=${MANIFEST_FIELDS[1]}
          EXPECTED_BYTES=${MANIFEST_FIELDS[2]}
          EXPECTED_SHA=${MANIFEST_FIELDS[3]}
          if [ "$MANIFEST_VERSION" != "$VERSION" ] || [ "$MANIFEST_PATH" != "current/$EXPECTED_NAME" ]; then
            echo "Release manifest does not match tag $GITHUB_REF_NAME or installer $EXPECTED_NAME." >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_BYTES" =~ ^[1-9][0-9]*$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Release manifest has an invalid size or SHA-256." >&2
            exit 1
          fi

          ACTUAL_BYTES=$(stat -c '%s' "$INSTALLER")
          ACTUAL_SHA=$(sha256sum "$INSTALLER" | awk '{print $1}')
          if [ "$ACTUAL_BYTES" != "$EXPECTED_BYTES" ] || [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Downloaded installer does not match the verified Windows manifest." >&2
            exit 1
          fi

          CHECKSUM_PATH="$(dirname "$INSTALLER")/SHA256SUMS.txt"
          printf '%s  %s\n' "$ACTUAL_SHA" "$EXPECTED_NAME" > "$CHECKSUM_PATH"
          (cd "$(dirname "$INSTALLER")" && sha256sum --check SHA256SUMS.txt)

          gh release create "$GITHUB_REF_NAME" "$INSTALLER" "$CHECKSUM_PATH" \
            --verify-tag \
            --fail-on-no-commits \
            --generate-notes \
            --notes '本版本仅发布 Windows NSIS 安装包；macOS 继续由 CI 验证，不作为此 Release 的资产。' \
            --title "Vellora $VERSION"
