name: Release

# Pushing a tag like v0.1.8 builds every download and puts them on a DRAFT
# release with their SHA256. Nothing is public until someone publishes it.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    name: Check tag matches version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="$(tr -d '\r' < Cargo.toml | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          python3 installer/tests/test_release_policy.py
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows Setup and portable zip
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Qt 6.8.3 MSVC 2022 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats'
          cache: 'true'

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path -LiteralPath $nsis)) { choco install nsis -y --no-progress }
          if (!(Test-Path -LiteralPath $nsis)) { throw 'makensis.exe not found' }
          "MAKENSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Setup and portable zip
        shell: pwsh
        run: ./installer/package-qt.ps1 -Version '${{ needs.version.outputs.version }}' -QtRoot $env:QT_ROOT_DIR -MakeNsis $env:MAKENSIS -OutputDir "$env:GITHUB_WORKSPACE\dist" -RunTests $false

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Vellora-Setup-*.exe
            dist/Vellora-*-portable-x64.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} AppImage
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl1-mesa-dev libegl1 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 fonts-noto-core fonts-noto-cjk fonts-dejavu-core file

      - name: Install Qt 6.8.3 (${{ matrix.qt_arch }})
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtimageformats'
          cache: 'true'

      - name: Package AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          VELLORA_ARCH: ${{ matrix.arch }}
        run: SKIP_BUILD=0 ./installer/linux/package-appimage.sh "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  draft:
    name: Draft GitHub release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Create draft release with SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd assets
          ls -l
          test -f "Vellora-Setup-$VERSION.exe"
          test -f "Vellora-$VERSION-portable-x64.zip"
          test -f "Vellora-$VERSION-x86_64.AppImage"
          test -f "Vellora-$VERSION-aarch64.AppImage"
          sha256sum * | awk '{ print $2; print toupper($1); print "" }' > ../SHA256.txt
          { echo "# Vellora $VERSION"; echo; echo "Draft. Release notes to be written."; echo; echo '```text'; cat ../SHA256.txt; echo '```'; } > ../notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Vellora $VERSION" --notes-file ../notes.md --verify-tag *
