[package]
name = "vellora"
version = "2.4.3"
description = "Vellora lightweight Markdown viewer and editor"
authors = ["Vellora Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "vellora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
open = "5"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
thiserror = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Security_Authorization"] }

# Production must enable this so the app loads embedded frontendDist
# instead of devUrl (http://localhost:1420). `tauri build` enables it; plain
# `cargo build --release` must pass `--features custom-protocol`.
[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
