[workspace]
resolver = "2"
members = ["core", "md", "bridge"]


[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
authors = ["Vellora Contributors"]

[workspace.dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "2"
url = "2"
windows-sys = "=0.61.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
